name: build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          # only caches ~/.m2/repository, the surefire-cached results in
          # ~/.m2/test-cache are not restored so that tests really run on both JDKs
          cache: maven

      # install, not verify: the gradle module is built by exec-maven-plugin in the
      # install phase and resolves the artifacts from the local repository
      - run: ./mvnw -B clean install
