name: build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # supersede pushes to the same PR, but never cancel a master build
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          # only caches ~/.m2/repository, the surefire-cached results in
          # ~/.m2/test-cache are not restored so that tests really run on both JDKs
          cache: maven

      # the gradle test module downloads its own distribution (~130 MB) on every run,
      # so the wrapper retries were raised too. Only the distribution is cached,
      # deliberately not ~/.gradle/caches: the module resolves
      # spring-test-smart-context:1.2-SNAPSHOT from mavenLocal, and a cached SNAPSHOT
      # would be a stale artifact trap.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('tests/**/gradle/wrapper/gradle-wrapper.properties') }}

      # install, not verify: the gradle module is built by exec-maven-plugin in the
      # install phase and resolves the artifacts from the local repository
      - run: ./mvnw -B clean install
